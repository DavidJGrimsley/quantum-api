name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Godot AssetLib export rules
        run: |
          test -f .gitattributes

          addons_attr="$(git check-attr export-ignore -- addons/quantum_api_client/quantum_api_client.gd)"
          case "$addons_attr" in
            "addons/quantum_api_client/quantum_api_client.gd: export-ignore: unspecified") ;;
            *)
              echo "Expected addons/quantum_api_client/quantum_api_client.gd to be included in git archive"
              echo "$addons_attr"
              exit 1
              ;;
          esac

          root_attr="$(git check-attr export-ignore -- README.md)"
          case "$root_attr" in
            "README.md: export-ignore: set") ;;
            *)
              echo "Expected README.md to be excluded from git archive"
              echo "$root_attr"
              exit 1
              ;;
          esac

          archive_listing="$(mktemp)"
          archive_invalid="$(mktemp)"
          trap 'rm -f "$archive_listing" "$archive_invalid"' EXIT
          git archive --format=tar HEAD | tar -tf - > "$archive_listing"

          if grep -vE '^addons(/|$)' "$archive_listing" > "$archive_invalid"; then
            echo "Archive contains paths outside addons/:"
            cat "$archive_invalid"
            exit 1
          fi

          grep -q '^addons/quantum_api_client/' "$archive_listing" || {
            echo "Archive is missing addons/quantum_api_client content"
            exit 1
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: >
          uv sync
          --extra dev
          --extra phase5-optimization
          --extra phase5-experiments
          --extra phase5-finance
          --extra phase5-ml
          --extra phase5-nature
          --extra phase5-docs
          --extra phase6-pennylane

      - name: Ruff
        run: uv run ruff check .

      - name: Portfolio Contract Smoke
        run: uv run pytest tests/test_api_contract.py -k portfolio

      - name: Pytest
        run: |
          uv run pytest --ignore=tests/test_api_contract.py
          uv run pytest tests/test_api_contract.py -k "not portfolio"

      - name: Build package
        run: uv build

      - name: Docker build
        run: docker build -t quantum-api:ci .

  godot-package-harness:
    name: Godot package harness (${{ matrix.godot_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godot_version: ["4.4.1", "4.5.2", "4.6.3", "4.7.2"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install archived addon into a clean Godot project
        run: |
          harness_dir="tests/godot/quantum_api_client_harness"
          rm -rf "$harness_dir/addons"
          mkdir -p "$harness_dir/addons"
          git archive --format=zip HEAD addons > /tmp/quantum-api-client.zip
          unzip -q /tmp/quantum-api-client.zip -d "$harness_dir"
          test -f "$harness_dir/addons/quantum_api_client/quantum_api_client.gd"

      - name: Download Godot ${{ matrix.godot_version }}
        run: |
          version="${{ matrix.godot_version }}"
          archive="Godot_v${version}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 --output "/tmp/$archive" \
            "https://github.com/godotengine/godot/releases/download/${version}-stable/$archive"
          unzip -q "/tmp/$archive" -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${version}-stable_linux.x86_64

      - name: Run deterministic package harness
        run: |
          python3 tests/godot/fixture_server.py &
          fixture_pid="$!"
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          sleep 1
          /tmp/godot/Godot_v${{ matrix.godot_version }}-stable_linux.x86_64 \
            --headless --path tests/godot/quantum_api_client_harness
